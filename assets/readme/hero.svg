<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Trace — a work tracker built on the clipboard shelf</title>
  <desc id="desc">An activity stream of foreground apps and clipboard copies is cut at cluster boundaries into three segments; each segment becomes a task card with a confidence meter, keeping apps, windows, and clips attached.</desc>

  <rect width="1200" height="400" rx="24" fill="#050607"/>

  <!-- ── Title block ─────────────────────────────────────────── -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="92" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="13" letter-spacing="3" fill="#6B7280">OBSERVE · SEGMENT · TRACK · SUGGEST</text>
    <text x="52" y="176" font-size="88" font-weight="800" letter-spacing="5" fill="#F3F4F6">TRACE</text>
    <text x="56" y="220" font-size="17" fill="#9CA3AF">A work tracker built on the clipboard shelf: it watches</text>
    <text x="56" y="248" font-size="17" fill="#9CA3AF">the apps you switch between and the things you copy,</text>
    <text x="56" y="276" font-size="17" fill="#9CA3AF">cuts that into tasks, and keeps every resource attached.</text>
    <text x="56" y="322" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#6B7280">Windows 10/11 · Electron 34 · TypeScript · 31 languages · local-first AI</text>
  </g>

  <!-- ── Activity stream, cut into segments ──────────────────── -->
  <g id="proof">
    <text x="700" y="58" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="9.5" letter-spacing="1.5" fill="#6B7280">FOREGROUND + CLIPBOARD STREAM, CUT INTO TASKS</text>

    <!-- segment numbers -->
    <text x="771" y="104" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#3B82F6">SEG 01</text>
    <text x="914" y="104" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#3B82F6">SEG 02</text>
    <text x="1057" y="104" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#3B82F6">SEG 03</text>

    <!-- timeline -->
    <line x1="700" y1="140" x2="1130" y2="140" stroke="#2A2D33" stroke-width="2"/>

    <!-- segment cut lines: run from the stream down through the card layer -->
    <line x1="843" y1="112" x2="843" y2="292" stroke="#3B82F6" stroke-width="1" opacity="0.5" stroke-dasharray="2 3"/>
    <line x1="986" y1="112" x2="986" y2="292" stroke="#3B82F6" stroke-width="1" opacity="0.5" stroke-dasharray="2 3"/>

    <!-- segment 1 events: VS Code, copy, Chrome, copy -->
    <circle cx="722" cy="140" r="5" fill="#3B82F6"/>
    <text x="722" y="128" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="9" fill="#9CA3AF">VS Code</text>
    <rect x="755" y="136" width="8" height="8" rx="1.5" fill="#6B7280"/>
    <circle cx="798" cy="140" r="5" fill="#3B82F6"/>
    <text x="798" y="128" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="9" fill="#9CA3AF">Chrome</text>
    <rect x="828" y="136" width="8" height="8" rx="1.5" fill="#6B7280"/>

    <!-- segment 2 events: Figma, copy, VS Code -->
    <circle cx="874" cy="140" r="5" fill="#3B82F6"/>
    <text x="874" y="128" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="9" fill="#9CA3AF">Figma</text>
    <rect x="906" y="136" width="8" height="8" rx="1.5" fill="#6B7280"/>
    <circle cx="944" cy="140" r="5" fill="#3B82F6"/>
    <text x="944" y="128" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="9" fill="#9CA3AF">VS Code</text>

    <!-- segment 3 events: Terminal, copy, Chrome, copy -->
    <circle cx="1016" cy="140" r="5" fill="#3B82F6"/>
    <text x="1016" y="128" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="9" fill="#9CA3AF">Terminal</text>
    <rect x="1048" y="136" width="8" height="8" rx="1.5" fill="#6B7280"/>
    <circle cx="1086" cy="140" r="5" fill="#3B82F6"/>
    <text x="1086" y="128" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="9" fill="#9CA3AF">Chrome</text>
    <rect x="1116" y="136" width="8" height="8" rx="1.5" fill="#6B7280"/>

    <!-- task card 1 -->
    <rect x="709" y="196" width="125" height="92" rx="10" fill="#0A0C10" stroke="#26292E" stroke-width="1"/>
    <rect x="709" y="196" width="2.5" height="92" rx="1" fill="#3B82F6"/>
    <text x="721" y="216" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="8.5" letter-spacing="1" fill="#6B7280">VS CODE + CHROME</text>
    <text x="721" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#F3F4F6">Rewrite drag</text>
    <text x="721" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#F3F4F6">icon ghost</text>
    <rect x="721" y="272" width="62" height="4" rx="2" fill="#1C2128"/>
    <rect x="721" y="272" width="46" height="4" rx="2" fill="#3B82F6"/>
    <text x="789" y="276" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="9" fill="#9CA3AF">74%</text>

    <!-- task card 2 -->
    <rect x="852" y="196" width="125" height="92" rx="10" fill="#0A0C10" stroke="#26292E" stroke-width="1"/>
    <rect x="852" y="196" width="2.5" height="92" rx="1" fill="#3B82F6"/>
    <text x="864" y="216" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="8.5" letter-spacing="1" fill="#6B7280">FIGMA + VS CODE</text>
    <text x="864" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#F3F4F6">Design review</text>
    <text x="864" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#F3F4F6">of the shelf</text>
    <rect x="864" y="272" width="62" height="4" rx="2" fill="#1C2128"/>
    <rect x="864" y="272" width="56" height="4" rx="2" fill="#14B8A6"/>
    <text x="932" y="276" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="9" fill="#9CA3AF">91%</text>

    <!-- task card 3 -->
    <rect x="995" y="196" width="125" height="92" rx="10" fill="#0A0C10" stroke="#26292E" stroke-width="1"/>
    <rect x="995" y="196" width="2.5" height="92" rx="1" fill="#3B82F6"/>
    <text x="1007" y="216" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="8.5" letter-spacing="1" fill="#6B7280">TERMINAL + CHROME</text>
    <text x="1007" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#F3F4F6">Release notes</text>
    <text x="1007" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#F3F4F6">for v0.2.6</text>
    <rect x="1007" y="272" width="62" height="4" rx="2" fill="#1C2128"/>
    <rect x="1007" y="272" width="38" height="4" rx="2" fill="#9CA3AF"/>
    <text x="1075" y="276" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Menlo, monospace" font-size="9" fill="#9CA3AF">61%</text>
  </g>
</svg>
